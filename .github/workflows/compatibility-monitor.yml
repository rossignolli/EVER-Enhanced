name: GTA V Enhanced compatibility monitor

on:
  schedule:
    # Mondays at 12:17 UTC (09:17 in Brasilia, UTC-3).
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: gta-enhanced-compatibility-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Compare the public Steam build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the public branch
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Read GTA V Enhanced public build from Steam
        shell: bash
        run: |
          set -euo pipefail
          steam_dir="$RUNNER_TEMP/steamcmd"
          output_file="$RUNNER_TEMP/steam-app-info.txt"
          mkdir -p "$steam_dir"
          curl --fail --location --silent --show-error \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$steam_dir"

          # SteamCMD occasionally returns a non-zero process status after
          # printing valid catalog data, so validate the output itself.
          set +e
          "$steam_dir/steamcmd.sh" \
            +login anonymous \
            +app_info_update 1 \
            +app_info_print 3240220 \
            +quit >"$output_file" 2>&1
          steam_exit=$?
          set -e
          echo "SteamCMD exit code: $steam_exit"
          grep -q '"3240220"' "$output_file"
          grep -q '"buildid"' "$output_file"

      - name: Update the README compatibility banner
        id: compatibility
        shell: bash
        run: |
          python3 scripts/update_compatibility_status.py \
            --steam-output "$RUNNER_TEMP/steam-app-info.txt" \
            --config compatibility.json \
            --readme README.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Commit a changed compatibility banner
        if: steps.compatibility.outputs.readme_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update GTA V Enhanced compatibility warning"
          git push origin HEAD:main

      - name: Create, update, or close the compatibility issue
        uses: actions/github-script@v8
        env:
          COMPATIBILITY_STATUS: ${{ steps.compatibility.outputs.status }}
          CURRENT_BUILD: ${{ steps.compatibility.outputs.current_build }}
          SUPPORTED_BUILD: ${{ steps.compatibility.outputs.supported_build }}
          SUPPORTED_GAME_VERSION: ${{ steps.compatibility.outputs.supported_game_version }}
          VALIDATED_ON: ${{ steps.compatibility.outputs.validated_on }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "compatibility-warning";
            const status = process.env.COMPATIBILITY_STATUS;
            const current = process.env.CURRENT_BUILD;
            const supported = process.env.SUPPORTED_BUILD;
            const gameVersion = process.env.SUPPORTED_GAME_VERSION;
            const validatedOn = process.env.VALIDATED_ON;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: "B60205",
                description: "A newer GTA V Enhanced build needs compatibility validation"
              });
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 100
            });

            if (status === "unsupported") {
              const title = `[Compatibility] GTA V Enhanced Steam build ${current} needs validation`;
              const body = [
                "The compatibility monitor detected a GTA V Enhanced public Steam build that has not been validated yet.",
                "",
                `- Detected Steam build: \`${current}\``,
                `- Last validated Steam build: \`${supported}\``,
                `- Last validated game version: \`${gameVersion}\``,
                `- Last validation date: ${validatedOn}`,
                "",
                "Do not clear the README warning merely because the game launches. Run the end-to-end export matrix, update `compatibility.json`, and manually dispatch this workflow after compatibility is proven."
              ].join("\n");

              const existing = openIssues[0];
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  title,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: [label]
                });
              }
            } else {
              for (const issue of openIssues) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: `Compatibility was validated and compatibility.json now matches Steam build \`${current}\`. Closing this automated warning.`
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "completed"
                });
              }
            }

      - name: Update the short repository description
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
          DESCRIPTION: ${{ steps.compatibility.outputs.description }}
        run: |
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::notice::REPOSITORY_ADMIN_TOKEN is not configured; README and issue automation remain active, but the short repository description cannot be changed."
            exit 0
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" -f description="$DESCRIPTION"
