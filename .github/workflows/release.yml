name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up vcpkg binary cache credentials
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-x64-windows-release-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg/versions/baseline.json') }}
          restore-keys: |
            vcpkg-x64-windows-release-${{ hashFiles('vcpkg.json') }}-
            vcpkg-x64-windows-release-

      - name: Unshallow vcpkg submodule
        shell: cmd
        run: git -C vcpkg fetch --unshallow

      - name: Build
        shell: cmd
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
          VCPKG_OVERLAY_TRIPLETS: triplets
        run: .\build.bat

      - name: Package release artifacts
        shell: pwsh
        run: |
          $tag      = "${{ github.ref_name }}"
          $staging  = "staging"
          $outDir   = "x64\Release"
          $licenses = "$staging\THIRD_PARTY_LICENSES"

          # Create clean staging area
          New-Item -ItemType Directory -Path $staging | Out-Null
          New-Item -ItemType Directory -Path $licenses | Out-Null

          # The z-prefix guarantees that ReShade loads before the EVER add-on.
          Copy-Item "$outDir\zEVER.asi" "$staging\zEVER.asi"

          # Copy EVER folder recursively
          Copy-Item "$outDir\EVER" "$staging\EVER" -Recurse

          # Remove debug symbols and map files that should not ship
          Get-ChildItem -Path $staging -Recurse -Include "*.pdb", "*.map" | Remove-Item -Force

          # Ship project documentation and the notices required by the bundled
          # dependencies. ScriptHookV is a user-installed prerequisite and is
          # intentionally not included.
          Copy-Item "LICENSE", "NOTICE", "README.md", "README.pt-BR.md", "README.es.md", "ENHANCED_PORT.md" $staging
          Copy-Item "docs" "$staging\docs" -Recurse

          Get-ChildItem "vcpkg_installed\x64-windows-release\share" -Directory | ForEach-Object {
            $copyright = Join-Path $_.FullName "copyright"
            if (Test-Path $copyright) {
              Copy-Item $copyright (Join-Path $licenses "$($_.Name).txt")
            }
          }

          # Create the release zip
          $zipName = "EVER-Enhanced-$tag.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipName -Force
          (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $zipName |
            Set-Content "$zipName.sha256" -Encoding ascii
          Write-Host "Created $zipName"

      - name: Create GitHub release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          name: "EVER Enhanced ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            EVER-Enhanced-${{ github.ref_name }}.zip
            EVER-Enhanced-${{ github.ref_name }}.zip.sha256
